# Builds the Astro site and publishes it to GitHub Pages.
# Cutover, repository variables and rollback: docs/deploy.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public values (they end up in the HTML), set as repository variables.
      # Unset: no contact form (email only) / no analytics script.
      PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
      PUBLIC_GOATCOUNTER_CODE: ${{ vars.PUBLIC_GOATCOUNTER_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint workflows (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The sound engine's unit tests run Web Audio in Node (node-web-audio-api),
      # whose Linux binary links the ALSA library (docs/adr/0011).
      - name: Install the ALSA library (sound engine tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2t64

      # npm run check ends with `astro build`, so dist/ is built exactly once.
      - name: Check and build (types, lint, unit tests with coverage, astro build)
        run: npm run check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job can write to Pages and request an OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
