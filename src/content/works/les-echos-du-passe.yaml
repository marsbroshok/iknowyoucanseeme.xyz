sourceNotes: >-
  2024-03-15T09:00:00.000

  Birdie on a throne in the Gorges Dades.

  Look at this little ruler of the world, surveying the UFO landing in his
  domain in the majestic Gorges Dades! This photo always makes me smile -
  there's something so regal about this little bird, even though he's probably
  just looking for his breakfast.


  I captured this photo on my OM System OM-1 with a telephoto lens at f/5.6,
  1/1000s, and ISO 400 to freeze the moment and blur the background a bit.


  The Gorges Dades are a truly breathtaking place, and this little feathered
  friend was the perfect way to add a touch of whimsy to the scene.


  What are your favorite unexpected animal encounters you've had while
  traveling? Let me know in the comments below!


