sourceNotes: >-
  2026-08-29T09:59:00.000

  As a lifelong sci-fi fan, I’ve always seen the sky as more than just a flat
  ceiling.


  For me, an eclipse is not a postcard moment - it’s a sudden manifestation of
  celestial mechanics. Colossal bodies moving in silence. The Moon slowly eating
  through the Sun.


  To strip away the cliché of a textbook eclipse photos, I catch the rays
  through mirrors and filters, tearing the light apart. 


  Cold stone swallowing solar fire until the void takes what’s left of this
  displaced pure energy.


  —

  Tech details: Custom handheld mirror deflections, selective neutral density,
  and forced internal reflections. Single exposure / in-camera.


