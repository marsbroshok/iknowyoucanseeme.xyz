sourceNotes: >-
  2025-05-02T05:07:00.000

  Moments captured between worlds, thank you @paul_rousteau for this magic ✨

  .

  This series is a journey, starting with glimpses into another side of Venice –
  the quiet mystery of its darker streets on a rainy morning. It reflects on
  that deep sense of connection we seek, the feeling of a continuum through time
  and space, and the undeniable force of the elements shaping our world. It’s
  about capturing the feeling of transition, the quiet presence of a soul moving
  through these evocative spaces.

  Beyond the canals, the series uses a blend of atmospheric landscapes,
  evocative portraits, and abstract captures to explore introspection – like a
  space travel of the mind or an inward journey unfolding. This mélange helps
  search for that living soul across different forms, whether found in a
  fleeting expression, an abstract wash of colour, or the lingering atmosphere
  of a place suspended between dream and reality.

