slug: lens
title:
  en: "Lens"
  fr: "La Loupe"
statement:
  status: draft
  en: >-
    Acting as a lens, this passage sharpens our perception from vast atmosphere
    to tangible detail, where abstract washes of colour resolve into unfamiliar
    flora, fractured physics, and quiet evidence of life.
  fr: >-
    Agissant comme une loupe, ce passage précise le regard de l'atmosphérique au
    singulier : les nappes abstraites de couleur s'y condensent en une flore
    insolite, une physique fracturée et d'étranges traces de vie.
  sources:
    - exhibition_statement_2025_p1
