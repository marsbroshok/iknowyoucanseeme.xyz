slug: arrival
title:
  en: "Arrival"
  fr: "Arrivée"
statement:
  status: draft
  en: >-
    The journey begins with a disorienting arrival into the vast atmospheric
    colour fields of the dream, where the anchor of a familiar shore dissolves
    into deep night blue and washed horizons.
  fr: >-
    Le parcours s'ouvre sur une arrivée désorientante dans les vastes champs
    colorés du rêve, là où l'ancrage d'un rivage familier se dissout dans le
    bleu profond de la nuit et les horizons mouvants.
  sources:
    - exhibition_statement_2025_p1
