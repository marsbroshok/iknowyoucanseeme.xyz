slug: leak
title:
  en: "Leak"
  fr: "L'Infiltration"
statement:
  status: draft
  en: >-
    At the permeable edge where the border blurs and realities mix, the
    Dreamland leaks into our waking world through colour-stained portraits of
    its inhabitants and the first unfired clay sketches of its fauna.
  fr: >-
    À la lisière perméable où la frontière se trouble et où les réalités se
    mêlent, le Dreamland s'infiltre dans notre monde à travers des portraits
    traversés de lumière et de premières esquisses façonnées dans l'argile crue.
  sources:
    - exhibition_statement_2025_p1
