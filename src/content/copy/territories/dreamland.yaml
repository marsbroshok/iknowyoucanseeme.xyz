slug: dreamland
statement:
  status: draft
  en: A journey is traditionally defined as a cycle whose final step is the return
    home. But as someone who has changed countries, I found myself adrift from
    the classic story of voyage and return. This work is born from that
    experience. It proposes that our most constant home is not a physical place,
    but the internal landscape of the dream. This inner world is a resonant
    space with a permeable boundary. As memory and present experience merge, the
    concept of 'home' evolves. The journey explored here is not of departure and
    return, but of this quiet, continuous transformation.
  fr: "Un voyage est souvent vu comme un cycle dont l'étape finale est le retour
    chez soi. Mais ayant changé de pays, je me suis éloigné de cette histoire
    classique. Ce travail est né de cette expérience : notre véritable maison
    n'est pas un lieu physique, mais le paysage intérieur du rêve. Ce monde
    intérieur a une frontière perméable. Au fur et à mesure que la mémoire et le
    présent se mélangent, l'idée de maison évolue. Le voyage exploré ici n'est
    pas un départ ou un retour, mais une transformation silencieuse et
    continue."
  sources:
    - exhibition_statement_2026
