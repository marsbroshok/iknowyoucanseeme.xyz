slug: dreamland
title:
  en: "Dreamland"
  fr: "Dreamland"
statement:
  status: draft
  en: >-
    A journey is traditionally defined as a cycle whose final step is the return
    home. But as someone who has changed countries, I found myself adrift from
    the classic story of voyage and return. When the anchor of a physical home
    is gone, this work proposes that our most constant home is not a place on a
    map, but the internal landscape of the dream. This inner world is not a
    sealed sanctuary, but a resonant space with a permeable boundary through
    which the atmosphere of a new reality gradually seeps in. As memory and
    present experience begin to merge, the very concept of home evolves—the
    alien begins to feel familiar, while the familiar takes on a strange new
    light. To shape these landscapes, the camera becomes an instrument of
    transformation, using custom filters, mirrors, and multiple exposures to
    fracture and reassemble memory and place in an unfamiliar language. The
    journey explored in these photographs and clay forms is therefore not one of
    departure and return, but of this quiet, continuous transformation.
  fr: >-
    Un voyage se définit traditionnellement comme un cycle dont l'ultime étape
    est le retour chez soi ; mais ayant changé de pays, je me suis trouvé à la
    dérive hors de ce récit classique de départ et de retour. Lorsque l'ancrage
    d'un foyer physique disparaît, ce travail propose que notre demeure la plus
    constante ne soit plus un lieu géographique, mais le paysage intérieur du
    rêve. Ce monde intérieur n'est toutefois pas un sanctuaire clos : c'est un
    espace résonant à la frontière perméable, à travers laquelle l'atmosphère
    d'une réalité nouvelle s'infiltre peu à peu. À mesure que la mémoire et
    l'expérience présente se confondent, l'idée même de « chez-soi » évolue :
    l'étranger devient familier, tandis que le familier prend une lumière neuve
    et singulière. Pour donner forme à ces paysages, l'appareil photo devient un
    instrument de métamorphose, usant de filtres sur mesure, de miroirs et
    d'expositions multiples pour fracturer et recomposer la mémoire et le lieu.
    Le voyage exploré dans ces photographies et ces formes d'argile n'est donc
    plus celui d'un aller-retour, mais celui d'une transformation silencieuse et
    continue.
  sources:
    - exhibition_statement_2026
