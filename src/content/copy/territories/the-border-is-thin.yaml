slug: the-border-is-thin
statement:
  status: draft
  en: There is a border between these worlds. If you point the camera in the right
    direction and apply some pressure, it becomes thin and reveals what is out
    there.
  fr: Il y a une frontière entre ces mondes. Mais si vous dirigez l'appareil photo
    dans la bonne direction, elle s'affine et révèle ce qui se cache de l'autre
    côté.
  sources:
    - cygne-icm-1
    - eclipse-miroir-9
