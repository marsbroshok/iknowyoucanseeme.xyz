slug: the-border-is-thin
title:
  en: "The border is thin"
  fr: "La frontière s'efface"
statement:
  status: draft
  en: >-
    In one world there is grey November rain, and in another autumn colours
    break into myriads of splashes; point the camera in the right direction,
    apply pressure, and the border thins to reveal what lies beyond. Whether
    sweeping across drifting birds or catching a solar eclipse through mirrors
    and filters that tear light apart, the lens strips away postcard clichés to
    expose silent celestial mechanics and displaced energy.
  fr: >-
    Dans un monde règne la pluie grise de novembre, dans un autre les couleurs
    d'automne éclatent en myriades d'éclaboussures ; il suffit d'orienter
    l'appareil dans la bonne direction et d'exercer une pression pour que la
    frontière s'efface. Qu'il accompagne le mouvement des oiseaux ou déchire les
    rayons d'une éclipse solaire à travers miroirs et filtres, l'objectif défait
    les clichés pour révéler la mécanique céleste silencieuse où la pierre
    froide avale le feu.
  sources:
    - cygne-icm-1
    - eclipse-miroir-9
